<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SFDS Assessment App</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p>St. Francis De Sales Sec. School</p>
        <h1>Assessment Criteria</h1>
      </header>
      <div id="subject-selector-root"></div>
      <div class="summary-strip">
        <div><strong id="student-count">0</strong><span>Students</span></div>
        <div><strong id="subject-count">0</strong><span>Subjects</span></div>
        <div><strong id="criteria-count">0</strong><span>Criteria</span></div>
      </div>
      <div id="criteria-list-root"></div>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
